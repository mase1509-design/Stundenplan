<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b7a4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stundenplan">
  <meta name="description" content="Dein persönlicher Stundenplan – offline auf iPhone und Android.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Stundenplan</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" class="brand-icon">
        <div>
          <div class="eyebrow">SCHULWOCHE</div>
          <h1>Stundenplan</h1>
        </div>
      </div>
      <button class="today-btn" id="todayBtn" type="button">Heute</button>
    </header>

    <main>
      <section class="hero-card">
        <div>
          <div class="eyebrow">JETZT</div>
          <div class="clock" id="clock">--:--</div>
          <div class="hero-date" id="date">—</div>
        </div>
        <div class="status-pill" id="statusPill">Lade…</div>
      </section>

      <section class="day-tabs" aria-label="Wochentage" id="dayTabs"></section>

      <section class="day-heading">
        <div>
          <div class="eyebrow">WOCHENTAG</div>
          <h2 id="dayTitle">—</h2>
        </div>
        <div class="progress-wrap">
          <span id="dayCount">0 Stunden</span>
          <div class="progress"><i id="dayProgress"></i></div>
        </div>
      </section>

      <section class="lessons" id="lessons" aria-live="polite"></section>

      <section class="info-card">
        <div class="info-icon">⌁</div>
        <div>
          <strong>Offline bereit</strong>
          <p>Nach dem ersten Aufruf funktioniert die App auch ohne Internet. Auf iPhone/Android kannst du sie über „Zum Home-Bildschirm“ installieren.</p>
        </div>
      </section>
    </main>

    <footer>Stundenplan · lokal &amp; privat</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
